[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "secure-federated-learning"
version = "0.1.0"
dependencies = [
    "flwr",
    "numpy",
    "pandas",
    "scikit-learn",
    "psutil",
]

[tool.hatch.build.targets.wheel]
packages = ["secure_federated_learning"]

[tool.flwr.app]
publisher = "ronak"

[tool.flwr.app.components]
serverapp = "secaggexample.server_app:app"
clientapp = "secaggexample.client_app:app"


